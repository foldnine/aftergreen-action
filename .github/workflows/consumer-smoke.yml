name: Consumer smoke (pinned SHA)
on:
  push:
    branches: [test/consumer-smoke]
permissions: {}
jobs:
  consume:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          node fixture.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done; exit 1
      - id: ok
        uses: foldnine/aftergreen-action@9dbefbb8d4ac36acc45eea8b25b34d63718f7ef4
        with:
          url: http://127.0.0.1:8765/
          contains: build=consumer-ok
      - id: bad
        continue-on-error: true
        uses: foldnine/aftergreen-action@9dbefbb8d4ac36acc45eea8b25b34d63718f7ef4
        with:
          url: http://127.0.0.1:8765/old
          contains: build=consumer-ok
      - id: unknown
        continue-on-error: true
        uses: foldnine/aftergreen-action@9dbefbb8d4ac36acc45eea8b25b34d63718f7ef4
        with:
          url: http://127.0.0.1:8766/
          timeout-seconds: '2'
      - env:
          A: ${{ steps.ok.outputs.verdict }}
          B: ${{ steps.bad.outcome }}/${{ steps.bad.outputs.verdict }}
          C: ${{ steps.unknown.outcome }}/${{ steps.unknown.outputs.verdict }}
        run: |
          echo "$A $B $C"
          test "$A" = VERIFIED && test "$B" = failure/FAILED && test "$C" = failure/UNKNOWN
